application:
  name: rocketchat
  pods:
  - name: app
    image: rocket.chat:latest
    path: /
    servicePorts:
    - 3000
    vars:
      MONGO_URL: mongodb://mongo.pod:27017/rocketchat
      MONGO_OPLOG_URL: mongodb://mongo.pod:27017/local
      ROOT_URL: "<%URL%>"
      PORT: "3000"
  - name: mongo
    image: mongo:6
    servicePorts:
    - 27017
    vars:
      MONGO_INITDB_DATABASE: rocketchat
    volumes:
    - name: rocketchat-db
      mountPath: /data/db
      size: 10Gi
